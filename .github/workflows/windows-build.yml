name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m unittest discover -s tests -v

      - name: Fetch and verify official ExifTool
        shell: pwsh
        run: ./scripts/fetch-exiftool.ps1 -Destination "build-assets/tools/exiftool"

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DNG-to-JPEG
          --collect-all rawpy
          --collect-all PIL
          --add-binary "build-assets/tools/exiftool/exiftool.exe;tools/exiftool"
          --add-data "build-assets/tools/exiftool/exiftool_files;tools/exiftool/exiftool_files"
          --add-data "build-assets/tools/exiftool/README.txt;tools/exiftool"
          src/dng_to_jpeg_gui.py

      - name: Smoke-test embedded ExifTool
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/DNG-to-JPEG.exe" -ArgumentList "--verify-portable" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }

      - name: Package release
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNG-to-JPEG-Windows
          path: |
            dist/DNG-to-JPEG-Windows-Portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DNG-to-JPEG-Windows-Portable.zip dist/SHA256SUMS.txt --notes-file RELEASE_NOTES.md --verify-tag
