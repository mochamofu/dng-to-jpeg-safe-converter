name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DNG-to-JPEG
          --collect-all rawpy
          --collect-all PIL
          src/dng_to_jpeg_gui.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/DNG-to-JPEG.exe package/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md package/
          Copy-Item licenses package/licenses -Recurse
          Compress-Archive -Path package/* -DestinationPath DNG-to-JPEG-Windows.zip
          (Get-FileHash DNG-to-JPEG-Windows.zip -Algorithm SHA256).Hash + "  DNG-to-JPEG-Windows.zip" | Set-Content SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNG-to-JPEG-Windows
          path: |
            DNG-to-JPEG-Windows.zip
            SHA256SUMS.txt

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" DNG-to-JPEG-Windows.zip SHA256SUMS.txt --generate-notes --verify-tag
